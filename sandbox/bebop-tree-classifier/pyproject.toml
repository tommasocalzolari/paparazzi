[tool.poetry]
name = "bebop-tree-classifier"
version = "0.1.0"
description = "A project for training fast classifiers suitable for deployment on a Bebop drone using tree patch data."
authors = ["Your Name <youremail@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.8"
numpy = "^1.21"
pandas = "^1.3"
scikit-learn = "^0.24"
torch = "^1.9"
torchvision = "^0.10"
pyyaml = "^5.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"